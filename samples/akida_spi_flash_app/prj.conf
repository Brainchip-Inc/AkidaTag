# =========================================================
# Nordic Defaults
# =========================================================
CONFIG_NCS_SAMPLES_DEFAULTS=y

# =========================================================
# Bootloader + DFU (FOTA over BLE)
# =========================================================
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# =========================================================
# Bluetooth (Peripheral + LBS)
# =========================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_LBS"

# LBS service
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

# GATT Client Support
CONFIG_BT_GATT_CLIENT=y

# Security / SMP
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SIGNING=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_MAX_PAIRED=3

# Bluetooth Settings in Flash
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# Bluetooth Performance Settings
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255

CONFIG_BT_FILTER_ACCEPT_LIST=y

CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_HCI_TX_STACK_SIZE=1024

# Preferred connection parameters
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# PHY + Data Length Update
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# =========================================================
# C++ Support
# =========================================================
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_RTTI=y

# libc++ full support
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_LIBCXX_LIBCPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# newlib
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# =========================================================
# SPI
# =========================================================
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=64

# =========================================================
# GPIO
# =========================================================
CONFIG_GPIO=y

# =========================================================
# Flash Support
# =========================================================
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# =========================================================
# Console / Logging
# =========================================================
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_PROMPT_RTT="uart:~$"
CONFIG_SHELL_BACKEND_RTT_BUFFER=0

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_RTT=n  # disabled to avoid conflicts

# SEGGER RTT Buffers
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=4096
CONFIG_SEGGER_RTT_CUSTOM_LOCKING=y

# =========================================================
# Debug
# =========================================================
CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# =========================================================
# System
# =========================================================
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

