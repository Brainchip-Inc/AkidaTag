# Which languages the lint gate checks in this repository.
#
# Remove any language this repo already lints in its own CI. The gates never
# replace or duplicate a lint job that is already working here.
#
# Recognised values: python javascript typescript c cpp bash html css
#
# `c` and `cpp` are deliberately absent: .github/workflows/lint.yml already runs
# clang-format over the changed C and C++ files through scripts/clang_format.sh,
# with the clang-format version pinned to the one in the repo's toolchain image.
# That job stays the single owner of C and C++ formatting.
LINT_LANGUAGES="python javascript typescript bash html css"
