# Which languages the lint gate checks in this repository.
#
# Remove any language this repo already lints in its own CI. The gates never
# replace or duplicate a lint job that is already working here.
#
# Recognised values: python javascript typescript c cpp bash html css
#
# `c` and `cpp` are included: this job absorbed the retired
# .github/workflows/lint.yml, so its C and C++ step is now the only clang-format
# gate in the repository. That step pins clang-format and delegates the file
# list to scripts/clang_format.sh, which stays the single owner of the extension
# and pruned-directory rules.
LINT_LANGUAGES="python javascript typescript c cpp bash html css"

# Paths the lint gate never looks at, as one extended regular expression matched
# against repository-relative paths.
#
# `src/deps/` is imported code: the Akida engine as `akida engine deploy` emits
# it, the FlatBuffers headers as the 2.0.8 release ships them, and kissfft as it
# was vendored. Every one of those trees has to stay identical to the version it
# came from, so a finding in one reports work nobody is allowed to do. A gate
# that reports work nobody can do gets switched off, so this one is pointed only
# at the code this repository actually owns and is free to reformat.
#
# The C and C++ step is excluded twice over, because it delegates its file list
# to scripts/clang_format.sh, whose own PRUNED_DIRS already drops src/deps. The
# regex is what covers every other language, and what a reader looking for the
# rule will find first.
#
# This is a blocklist rather than an allowlist on purpose. A newly imported tree
# that nobody remembers to add here fails loudly on the pull request that lands
# it, and the person landing it knows exactly which line to add. An allowlist
# would instead drop newly written BrainChip code out of the gate in silence,
# and nobody would ever find out. So when you add a tree under src/deps, or any
# other imported or generated tree, extend this line in the same pull request.
LINT_EXCLUDE_REGEX="^src/deps/"
