name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      ncs_version:
        description: 'NCS SDK version (e.g., v3.1.1)'
        required: true
        default: 'v3.1.1'
      python_version:
        description: 'Python version (e.g., 3.12)'
        required: true
        default: '3.12'

permissions:
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/brainchip-inc/spark-ncs:${{ inputs.ncs_version }}-py${{ inputs.python_version }}
