name: Firmware Release

on:
  pull_request:
    types: [closed]
    branches: [release]

permissions:
  contents: write
  packages: read

env:
  DOCKER_IMAGE: ghcr.io/brainchip-inc/spark-ncs:v3.1.1-py3.12

jobs:
  build-and-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ -z "$VERSION" ]]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $VERSION"

      - name: Determine release type from PR labels
        id: release_type
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"release"'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release type: official release"
          elif echo "$LABELS" | grep -q '"pre-release"'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Release type: pre-release"
          else
            echo "::error::PR must have either 'release' or 'pre-release' label"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      # Runs before the build so a missing or empty changelog entry fails the
      # job in seconds rather than after a full firmware build.
      - name: Build release body from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HEADING="## [$VERSION]"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found at the repository root"
            exit 1
          fi

          # The version contains '+', which is a regex metacharacter, so the
          # heading is matched as a literal prefix rather than as a pattern.
          # Stops at the next '## ' heading so only this version is published.
          awk -v h="$HEADING" '
            index($0, h) == 1 { f = 1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > changelog-section.md

          if ! grep -q '[^[:space:]]' changelog-section.md; then
            echo "::error::No CHANGELOG.md section with content for $VERSION. Expected a heading of the exact form '$HEADING - YYYY-MM-DD'."
            exit 1
          fi

          # Strip leading and trailing blank lines from the extracted section.
          awk '
            NF && !started { started = 1 }
            started { buf[++n] = $0; if (NF) last = n }
            END { for (i = 1; i <= last; i++) print buf[i] }
          ' changelog-section.md > release-body.md

          # Static footer: the artifact set is the same for every release, so it
          # belongs to the release machinery rather than to the changelog.
          cat >> release-body.md <<EOF

          ## Artifacts

          | File | Purpose |
          |------|---------|
          | \`spark-$VERSION.signed.hex\` | Signed firmware for JLink flashing |
          | \`spark-$VERSION.signed.bin\` | Signed firmware for OTA/DFU via BLE |
          | \`spark-$VERSION-merged.hex\` | MCUboot + app for initial programming |
          | \`spark-$VERSION-dfu.zip\` | DFU package for nRF Connect mobile app |
          | \`SHA256SUMS.txt\` | Integrity checksums |
          EOF

          echo "Release body:"
          cat release-body.md

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          echo "After cleanup:"
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull "$DOCKER_IMAGE"

      - name: Reconstruct production signing key
        run: |
          mkdir -p .env
          echo "${{ secrets.PRODUCTION_SIGNING_KEY_PEM_B64 }}" | base64 -d > .env/signing_key.pem
          chmod 600 .env/signing_key.pem

      - name: Patch version in prj.conf
        run: |
          sed -i 's|CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION=.*|CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="${{ steps.version.outputs.version }}"|' \
            source/prj.conf
          echo "Patched prj.conf:"
          grep CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION source/prj.conf

      - name: Build firmware (Spark board)
        run: |
          ./scripts/run.sh \
            -d "$DOCKER_IMAGE" \
            --release \
            -b \
            --app demo_apps

      - name: Collect artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-artifacts

          cp build_docker/demo_apps/source/zephyr/zephyr.signed.hex \
             "release-artifacts/spark-${VERSION}.signed.hex"
          cp build_docker/demo_apps/source/zephyr/zephyr.signed.bin \
             "release-artifacts/spark-${VERSION}.signed.bin"
          cp build_docker/demo_apps/merged.hex \
             "release-artifacts/spark-${VERSION}-merged.hex"
          cp build_docker/demo_apps/dfu_application.zip \
             "release-artifacts/spark-${VERSION}-dfu.zip"

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "Checksums:"
          cat SHA256SUMS.txt

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Spark Firmware ${{ steps.version.outputs.tag }}"
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          body_path: release-body.md
          files: |
            release-artifacts/*
