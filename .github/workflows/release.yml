name: Firmware Release

on:
  pull_request:
    types: [closed]
    branches: [release]

permissions:
  contents: read

env:
  DOCKER_IMAGE: ghcr.io/brainchip-inc/akidatag-ncs:v3.1.1-py3.12

jobs:
  model-packages:
    name: model packages
    permissions:
      contents: read
      packages: read
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      KWS_CONFIG: .env/demo_apps/kws.yaml
      KWS_EDGE_LEARNING_CONFIG: .env/demo_apps/kws_edge_learning.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull "$DOCKER_IMAGE"

      - name: Write model configs
        env:
          KWS_CONFIG_YAML: ${{ secrets.MODEL_CONFIG_DEMO_APPS_KWS }}
          KWS_EDGE_LEARNING_CONFIG_YAML: ${{ secrets.MODEL_CONFIG_DEMO_APPS_KWS_EDGE_LEARNING }}
        run: |
          set -euo pipefail
          if [[ -z "$KWS_CONFIG_YAML" ]]; then
            echo "::error::Standard KWS model config is empty or unset"
            exit 1
          fi
          if [[ -z "$KWS_EDGE_LEARNING_CONFIG_YAML" ]]; then
            echo "::error::KWS edge-learning model config is empty or unset"
            exit 1
          fi
          mkdir -p "$(dirname "$KWS_CONFIG")"
          printf '%s\n' "$KWS_CONFIG_YAML" > "$KWS_CONFIG"
          printf '%s\n' "$KWS_EDGE_LEARNING_CONFIG_YAML" > "$KWS_EDGE_LEARNING_CONFIG"
          chmod 600 "$KWS_CONFIG" "$KWS_EDGE_LEARNING_CONFIG"

      - name: Mask model source addresses
        run: |
          set -euo pipefail
          model_urls=$(
            docker run --rm -i \
              --entrypoint python \
              -v "$PWD:/akidatag:ro" \
              -w /akidatag \
              "$DOCKER_IMAGE" \
              - "$KWS_CONFIG" "$KWS_EDGE_LEARNING_CONFIG" <<'PY'
          import sys

          import yaml

          for config_path in sys.argv[1:]:
              with open(config_path) as config_file:
                  model_url = yaml.safe_load(config_file).get("model_url")
              if not model_url:
                  raise SystemExit(f"{config_path} has no model_url")
              print(model_url)
          PY
          )
          while IFS= read -r model_url; do
            if [[ -n "$model_url" ]]; then
              echo "::add-mask::$model_url"
            fi
          done <<< "$model_urls"

      - name: Build model packages
        run: |
          set -euo pipefail
          ./scripts/run.sh \
            -d "$DOCKER_IMAGE" \
            --release \
            --fetch_model "$KWS_CONFIG" \
            --generate_info "$KWS_CONFIG"
          ./scripts/run.sh \
            -d "$DOCKER_IMAGE" \
            --release \
            --fetch_model "$KWS_EDGE_LEARNING_CONFIG" \
            --generate_info "$KWS_EDGE_LEARNING_CONFIG"

      - name: Collect and verify model packages
        run: |
          set -euo pipefail
          mkdir -p release-model-packages
          cp models/kws/kws.zip \
            release-model-packages/akidatag-kws-model.zip
          cp models/kws_edge_learning/kws_edge_learning.zip \
            release-model-packages/akidatag-kws-edge-learning-model.zip

          docker run --rm -i \
            --entrypoint python \
            -v "$PWD:/akidatag:ro" \
            -w /akidatag \
            "$DOCKER_IMAGE" \
            - <<'PY'
          from zipfile import ZipFile

          packages = {
              "release-model-packages/akidatag-kws-model.zip": {
                  "kws/info.yaml",
                  "kws/kws_program_info.bin",
                  "kws/kws_program_data.bin",
              },
              "release-model-packages/akidatag-kws-edge-learning-model.zip": {
                  "kws_edge_learning/info.yaml",
                  "kws_edge_learning/kws_program_info.bin",
                  "kws_edge_learning/kws_program_data.bin",
              },
          }

          for package_path, expected_files in packages.items():
              with ZipFile(package_path) as package:
                  corrupt_file = package.testzip()
                  actual_files = {
                      file_name
                      for file_name in package.namelist()
                      if not file_name.endswith("/")
                  }
              if corrupt_file:
                  raise SystemExit(f"{package_path} has a corrupt file: {corrupt_file}")
              if actual_files != expected_files:
                  raise SystemExit(
                      f"{package_path} contains {sorted(actual_files)}, "
                      f"expected {sorted(expected_files)}"
                  )
              print(f"Verified {package_path}: {sorted(actual_files)}")
          PY

      - name: Upload model packages
        uses: actions/upload-artifact@v4
        with:
          name: release-model-packages
          path: release-model-packages/*.zip
          if-no-files-found: error
          retention-days: 1

      - name: Remove model configs
        if: always()
        run: rm -f "$KWS_CONFIG" "$KWS_EDGE_LEARNING_CONFIG"

  build-and-release:
    permissions:
      contents: write
      packages: read
    if: github.event.pull_request.merged == true
    needs: [model-packages]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ -z "$VERSION" ]]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $VERSION"

      - name: Determine release type from PR labels
        id: release_type
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"release"'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release type: official release"
          elif echo "$LABELS" | grep -q '"pre-release"'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Release type: pre-release"
          else
            echo "::error::PR must have either 'release' or 'pre-release' label"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      # Runs before the build so a missing or empty changelog entry fails the
      # job in seconds rather than after a full firmware build.
      - name: Build release body from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HEADING="## [$VERSION]"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found at the repository root"
            exit 1
          fi

          # The version contains '+', which is a regex metacharacter, so the
          # heading is matched as a literal prefix rather than as a pattern.
          # Stops at the next '## ' heading so only this version is published.
          awk -v h="$HEADING" '
            index($0, h) == 1 { f = 1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > changelog-section.md

          if ! grep -q '[^[:space:]]' changelog-section.md; then
            echo "::error::No CHANGELOG.md section with content for $VERSION. Expected a heading of the exact form '$HEADING - YYYY-MM-DD'."
            exit 1
          fi

          # Strip leading and trailing blank lines from the extracted section.
          awk '
            NF && !started { started = 1 }
            started { buf[++n] = $0; if (NF) last = n }
            END { for (i = 1; i <= last; i++) print buf[i] }
          ' changelog-section.md > release-body.md

          # Static footer: the artifact set is the same for every release, so it
          # belongs to the release machinery rather than to the changelog.
          cat >> release-body.md <<EOF

          ## Artifacts

          | File | Purpose |
          |------|---------|
          | \`akidatag-$VERSION.signed.hex\` | Signed firmware for JLink flashing |
          | \`akidatag-$VERSION.signed.bin\` | Signed firmware for OTA/DFU via BLE |
          | \`akidatag-$VERSION-merged.hex\` | MCUboot + app for initial programming |
          | \`akidatag-$VERSION-dfu.zip\` | DFU package for nRF Connect mobile app |
          | \`akidatag-kws-model.zip\` | Keyword spotting model package for BrainChip Connect |
          | \`akidatag-kws-edge-learning-model.zip\` | Keyword spotting edge-learning model package for BrainChip Connect |
          | \`SHA256SUMS.txt\` | Integrity checksums |
          EOF

          echo "Release body:"
          cat release-body.md

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          echo "After cleanup:"
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull "$DOCKER_IMAGE"

      - name: Reconstruct production signing key
        run: |
          mkdir -p .env
          echo "${{ secrets.PRODUCTION_SIGNING_KEY_PEM_B64 }}" | base64 -d > .env/production_key.pem
          chmod 600 .env/production_key.pem

      # src/sysbuild.conf points at the committed development key, which is
      # public on purpose so that a fresh clone builds with no setup. An
      # official release must be signed with the production key instead, so
      # repoint it here. This is the single line that separates a local build
      # from a published one, and the guard below refuses to build if it ever
      # stops working: a release accidentally signed with the public key would
      # be trusted by every board flashed from it.
      - name: Point the build at the production signing key
        run: |
          sed -i 's|^SB_CONFIG_BOOT_SIGNATURE_KEY_FILE=.*|SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\\${APP_DIR}/../.env/production_key.pem"|' \
            src/sysbuild.conf
          echo "Patched sysbuild.conf:"
          grep SB_CONFIG_BOOT_SIGNATURE_KEY_FILE src/sysbuild.conf \
            || echo "(no SB_CONFIG_BOOT_SIGNATURE_KEY_FILE line found)"
          # Both greps below skip comment lines: ^[^#]* cannot cross a '#', so
          # only a live setting can match. src/sysbuild.conf names both key
          # files in its own comments, and a naive grep would fail a correct
          # release.
          if grep -q '^[^#]*development_key\.pem' src/sysbuild.conf; then
            echo "::error::sysbuild.conf still points at the development key; refusing to sign a release with it"
            exit 1
          fi
          # Catches the case the guard above cannot: the key file line being
          # absent from sysbuild.conf altogether. The sed then matches nothing
          # and the development-key grep passes vacuously, while sysbuild falls
          # back to MCUboot's own root-rsa-2048.pem, whose private half anyone
          # can download.
          if ! grep -q '^[^#]*\.env/production_key\.pem' src/sysbuild.conf; then
            echo "::error::sysbuild.conf does not point at the production key after patching"
            exit 1
          fi

      - name: Patch version in prj.conf
        run: |
          sed -i 's|CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION=.*|CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="${{ steps.version.outputs.version }}"|' \
            src/prj.conf
          echo "Patched prj.conf:"
          grep CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION src/prj.conf

      - name: Build firmware (AkidaTag board)
        run: |
          ./scripts/run.sh \
            -d "$DOCKER_IMAGE" \
            --release \
            -b \
            --app demo_apps

      - name: Download model packages
        uses: actions/download-artifact@v4
        with:
          name: release-model-packages
          path: release-model-packages

      - name: Collect artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-artifacts

          cp build_docker/demo_apps/src/zephyr/zephyr.signed.hex \
             "release-artifacts/akidatag-${VERSION}.signed.hex"
          cp build_docker/demo_apps/src/zephyr/zephyr.signed.bin \
             "release-artifacts/akidatag-${VERSION}.signed.bin"
          cp build_docker/demo_apps/merged.hex \
             "release-artifacts/akidatag-${VERSION}-merged.hex"
          cp build_docker/demo_apps/dfu_application.zip \
             "release-artifacts/akidatag-${VERSION}-dfu.zip"
          cp release-model-packages/akidatag-kws-model.zip \
             release-artifacts/akidatag-kws-model.zip
          cp release-model-packages/akidatag-kws-edge-learning-model.zip \
             release-artifacts/akidatag-kws-edge-learning-model.zip

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "Checksums:"
          cat SHA256SUMS.txt

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AkidaTag Firmware ${{ steps.version.outputs.tag }}"
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          body_path: release-body.md
          files: |
            release-artifacts/*
