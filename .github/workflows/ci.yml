name: HIL_Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  # Model parameters live in a per-(app,model) config that is local-only on the
  # self-hosted runner (git-ignored under .env/, like the signing key). See
  # .env/README.md for the schema.
  MODEL_CONFIG: .env/demo_apps/kws.yaml
  MODEL_DIR: source/external/model_files/kws
  MODEL_NAME: kws

concurrency:
  group: hil-hardware-test
  cancel-in-progress: false

jobs:
  hardware-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        
      - name: Generate Signing Key
        timeout-minutes: 4
        run: |
          ./scripts/run.sh -d --key

      - name: Fetch + Generate Model
        timeout-minutes: 4
        run: |
          ./scripts/run.sh -d \
          --config "${MODEL_CONFIG}" \
          --fetch_model --generate_info

      - name: Build and Flash
        timeout-minutes: 4
        run: |
          ./scripts/run.sh -d -b -f --dk --app demo_apps

      - name: Run CLI Test
        timeout-minutes: 4
        run: |
          ./scripts/run.sh -d -t
      
      - name: Upload Model
        timeout-minutes: 4
        run: |
          /home/demo/.conda/envs/spark/bin/python source/utils/send_model_via_ble.py \
          --info "${MODEL_DIR}/${MODEL_NAME}_program_info.bin" \
          --bin "${MODEL_DIR}/${MODEL_NAME}_program_data.bin" \
          --yaml "${MODEL_DIR}/info.yaml"

      - name: Run inference CLI Test
        timeout-minutes: 4
        run: |
          ./scripts/run.sh -d -t --infer-test