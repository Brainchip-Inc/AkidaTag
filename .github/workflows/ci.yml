name: HIL_Test

on:
  pull_request:
    branches: [ main ]

jobs:
  hardware-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Generate Signing Key
        run: |
          ./scripts/run.sh -d --key

      - name: Transfer Model
        run: |
          ./scripts/run.sh -d \
          --model_transfer "https://drive.usercontent.google.com/download?id=19iPANlklDn_OAmPVgurPpCCfZnxyNkaf&export=download&authuser=0" \
          --model_name kws \
          --model_flash_addr 0x101000 \
          --map_mode 1
      - name: Build and Flash
        run: |
          ./scripts/run.sh -d -b -f --dk --app demo_apps

      - name: Run CLI Test
        run: |
          ./scripts/run.sh -d -t
      
      - name: Upload Model
        run: |
          /home/demo/.conda/envs/spark/bin/python source/utils/send_model_via_ble.py \
          --info source/external/model_files/kws/kws_program_info.bin \
          --bin source/external/model_files/kws/kws_program_data.bin \
          --yaml source/external/model_files/kws/info.yaml

      - name: Run inference CLI Test
        run: |
          ./scripts/run.sh -d -t --infer-test