CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y         # for nRF SoCs
CONFIG_MFCC_SAMPLE_COUNT=320
CONFIG_CHANNELS_PER_SAMPLE=1
CONFIG_SAMPLING_RATE=16000
# PDM capture block size (ms); multiple of 20, <= CONFIG_AUDIO_MAX_BLOCK_MS.
# 20 ms = lowest latency (one MFCC hop/block); HW-validated. Runtime: `app blkms`.
CONFIG_AUDIO_BLOCK_MS=20
# Upper bound the DMA slab / audio buffers are statically sized for
CONFIG_AUDIO_MAX_BLOCK_MS=80
CONFIG_SYNC_MODE=1
CONFIG_MFCC_METHOD=1
CONFIG_BATCH_SIZE=4

