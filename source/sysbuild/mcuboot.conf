CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_UART_CONSOLE=n
CONFIG_MCUBOOT_INDICATION_LED=y
# Disable Nordic QSPI NOR driver since external flash is accessed over SPI, not QSPI.
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_SPI=y
# Enable generic SPI NOR flash driver to support external SPI flash devices.
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_GPIO=y
# STEP 4.1 - Increase number of sectors
# This is 512 for the nRF54L15 but can be smaller for other chips
CONFIG_BOOT_MAX_IMG_SECTORS=512

# Signature verification settings
CONFIG_BOOT_SIGNATURE_TYPE_RSA_LEN=3072
# Recommended for Security Level 4 environments
CONFIG_BOOT_VALIDATE_SLOT0=y
