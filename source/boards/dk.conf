# Kconfig fragment merged only by the DK build, via EXTRA_CONF_FILE in the
# --dk branch of scripts/run.sh. It is deliberately NOT named after a board
# target: both the AkidaTAG board and the DK are built for the same Zephyr board
# (nrf5340dk/nrf5340/cpuapp, see docker/Dockerfile), so an auto-discovered
# boards/nrf5340dk_nrf5340_cpuapp.conf would be merged into the AkidaTAG build as
# well and could not tell the two apart. The board difference in this project
# is carried by the CMake arguments run.sh selects, so the override lives there
# too, next to the devicetree overlay choice.

# Distinguish the DK from the AkidaTAG board on air. The legacy advertising packet
# is 31 bytes and this name is one character away from filling it: flags (3) +
# name (2 + 11) + manufacturer data (2 + 12) = 30 bytes. Lengthening this name
# overflows the packet and bt_le_adv_start() will fail with -EINVAL.
CONFIG_BT_DEVICE_NAME="AkidaTAG-DK"
