#SB_CONFIG_PARTITION_MANAGER=y
# Enable MCUboot
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
# Signature verification settings
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
# The committed development key, which is public on purpose: see the header
# inside the file itself. Official releases override this from CI with the
# private production key, which is the only difference between a build from
# this repository and a build BrainChip publishes.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${APP_DIR}/../keys/NOT-SECRET-development-signing-key.pem"