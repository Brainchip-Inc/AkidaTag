# =========================================================
# Nordic Defaults
# =========================================================

CONFIG_PM=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# Disable Nordic QSPI NOR driver since external flash is accessed over SPI, not QSPI.
CONFIG_NORDIC_QSPI_NOR=n
# Enable generic SPI NOR flash driver to support external SPI flash devices.
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_CMSIS_DSP=n

#This sets the maximum number of files that can be open simultaneously across all mounted LittleFS volumes.
CONFIG_FS_LITTLEFS_NUM_FILES=10
#This sets the maximum number of directories that can be open simultaneously (using fs_opendir()).
CONFIG_FS_LITTLEFS_NUM_DIRS=5


CONFIG_NCS_SAMPLES_DEFAULTS=y


#for low power
# Power management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Shell safety
CONFIG_UART_INTERRUPT_DRIVEN=y

# =========================================================
# Bootloader + DFU (FOTA over BLE)
# =========================================================


# New NCS/Zephyr Logging Syntax
#CONFIG_BT_LOG_LEVEL_DBG=y
#CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y
#CONFIG_BT_ATT_LOG_LEVEL_DBG=y
#CONFIG_BT_GATT_LOG_LEVEL_DBG=y

# Ensure the main logger is active
#CONFIG_LOG=y
#CONFIG_LOG_MODE_DEFERRED=y
# mcumgr core (also set below in MCUmgr section)
# Image management (also set below in MCUboot section)

# =========================================================
# Bluetooth Core Configuration
# =========================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AkidaTag"

# =========================================================
# LBS (LED Button Service)
# =========================================================
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

# =========================================================
# GATT Configuration
# =========================================================
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# =========================================================
# BLE Security Configuration - PRODUCTION READY
# =========================================================

# Core Security
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SIGNING=y


# Secure Connections Only (Reject Legacy Pairing)
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y

# Require MITM Protection
CONFIG_BT_SMP_ENFORCE_MITM=y

# Maximum Encryption Key Size (128-bit)
CONFIG_BT_SMP_MIN_ENC_KEY_SIZE=16

# Privacy Features
CONFIG_BT_PRIVACY=y
CONFIG_BT_RPA_TIMEOUT=900

# Pairing Limits
CONFIG_BT_MAX_PAIRED=3

# Bonding Storage
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# =========================================================
# MCUboot & DFU
# =========================================================
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# =========================================================
# MCUmgr (Firmware Update over BLE)
# =========================================================
CONFIG_MCUMGR=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# MCUmgr Commands
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_STAT=y

# Dependencies
CONFIG_ZCBOR=y
CONFIG_CRC=y

# =========================================================
# Persistent Storage (Required for Bonding)
# =========================================================
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# =========================================================
# Bluetooth Performance & Buffer Configuration
# =========================================================

# Buffer Counts
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=20
CONFIG_BT_BUF_EVT_RX_COUNT=20

# Buffer Sizes (Optimized for MCUmgr OTA)
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255
CONFIG_BT_L2CAP_TX_MTU=498


# Connection Performance
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_HCI_TX_STACK_SIZE=1024

# =========================================================
# Connection Parameters
# =========================================================
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# =========================================================
# PHY & Data Length Optimization
# =========================================================
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y


# =========================================================
# C++ Support
# =========================================================
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_RTTI=y

CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# libc++ full support
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_LIBCXX_LIBCPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# newlib
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# =========================================================
# SPI
# =========================================================
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=64

# =========================================================
# GPIO
# =========================================================
CONFIG_GPIO=y

# =========================================================
# Console / Logging
# =========================================================
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

#CONFIG_RTT_CONSOLE=y
#CONFIG_USE_SEGGER_RTT=y

#CONFIG_THREAD_MONITOR=y
#CONFIG_INIT_STACKS=y
CONFIG_SHELL=y
#CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_PROMPT_RTT="uart:~$"
CONFIG_SHELL_BACKEND_RTT_BUFFER=0

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_RTT=n  # disabled to avoid conflicts

# SEGGER RTT Buffers
#CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
#CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=4096
#CONFIG_SEGGER_RTT_CUSTOM_LOCKING=y

# =========================================================
# Debug
# =========================================================
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_SIZE_OPTIMIZATIONS=y

# =========================================================
# System
# =========================================================

# 100 KB i.e multiples of 100 bytes to ease the BLE operations
CONFIG_SRAM_BUFFER_SIZE=102236

CONFIG_BT_RX_STACK_SIZE=3076
CONFIG_HEAP_MEM_POOL_SIZE=76800

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_HW_STACK_PROTECTION=y

CONFIG_THREAD_STACK_INFO=y


# Enble CONFIG_DEBUG, CONFIG_STACK_SENTINEL, CONFIG_STACK_CANARIES and CONFIG_ASSERT for debug build
#CONFIG_DEBUG=y
# Enable stack sentinel for better debugging of these exact crashes
#CONFIG_STACK_SENTINEL=y
#CONFIG_STACK_CANARIES=y

# Helpful for catching the exact cause of fatal errors
#CONFIG_ASSERT=y

# Support 2 upgradeable images: App Core + Net Core
CONFIG_UPDATEABLE_IMAGE_NUMBER=2
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.2.0+0"

# To monitor stack and Heap usage enable below configs
#CONFIG_SYS_HEAP_RUNTIME_STATS=y
#CONFIG_THREAD_NAME=y
#CONFIG_THREAD_ANALYZER=y
#CONFIG_THREAD_ANALYZER_AUTO=y
#CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
#CONFIG_THREAD_ANALYZER_USE_PRINTK=y


# =========================================================
# I2C ACC/GYRO
# =========================================================

# Enable the I2C driver
CONFIG_I2C=y
# Enable Events
CONFIG_EVENTS=y

#Enable watchdog
CONFIG_WDT_ENABLE=y
CONFIG_WDT_LOG_LEVEL_DBG=y
CONFIG_WATCHDOG=y
CONFIG_APP_WDT_TIMEOUT_MS=8000
CONFIG_HWINFO=y
# Enable the NUS service
CONFIG_BT_NUS=y

# Enable system reboot support (Enables sys_reboot() API for programmatic system reset)
CONFIG_REBOOT=y

#Enable Current IC 
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y